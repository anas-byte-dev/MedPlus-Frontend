<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield / Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Clinical Cross (Subtle Background Glow) -->
  <rect x="27" y="14" width="10" height="36" rx="4" fill="#06b6d4" fill-opacity="0.18"/>
  <rect x="14" y="27" width="36" height="10" rx="4" fill="#06b6d4" fill-opacity="0.18"/>

  <!-- Dynamic Electrocardiogram (ECG / Pulse) Waveform -->
  <path d="M8 32 H20 L24 24 L29 42 L35 18 L40 37 L44 30 L48 32 H56" 
        stroke="url(#pulseGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Pulse Origin Indicator Dot -->
  <circle cx="35" cy="18" r="3" fill="#10b981" filter="url(#glow)"/>
</svg>